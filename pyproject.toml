[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [tool.hatch.metadata]
# allow-direct-references = true

# [tool.hatch.build.hooks.custom]
# path = "pybullet_tree_sim/utils/mesh_downloader.py"



[project]
name = "pybullet_tree_sim"
version = "0.0.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Abhinav Jain", email = "jainab@oregonstate.edu" },
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
maintainers = [
    { name = "Abhinav Jain", email = "jainab@oregonstate.edu" },
    { name = "Luke Strohbehn", email = "luke.strohbehn@gmail.com" },
]
description = "A PyBullet package for simulating trees with the UR5 arm."
requires-python = ">=3.9"
dependencies = [
    "filelock",
    "gymnasium",
    "h5py",
    "modern_robotics",
    "numpy==1.26.4",
    "nptyping",
    "opencv-python",
    "pandas",
    "plotly",
    "pybullet-planning",
    "pybullet==3.2.6",
    "pywavefront",
    "pyyaml",
    "requests",
    "scikit-image",
    "scipy",
    "tqdm",
    "xacro",
    "zenlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "toolz",
]
rl = [
    "imageio",
    "matplotlib",
    "pillow",
    "psutil",
    "sb3-contrib",
    "seaborn",
    "stable-baselines3",
    "torch",
    "torchvision",
    "wandb",
]

[project.scripts]
mesh_downloader = 'pybullet_tree_sim.utils.mesh_downloader:main'